name: Unzip project
on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and flatten
        run: |
          unzip -o loom-messenger-updated.zip -d extracted
          shopt -s dotglob
          mv extracted/NyxAppNew/* .
          rm -rf extracted loom-messenger-updated.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project into repo root"
          git push
